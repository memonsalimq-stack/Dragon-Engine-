# Repo me save karo: .github/workflows/build-apk.yml
# Phir project zip ko repo me (best: upload/ folder me) commit/upload karo.
# Build apne aap chalega, APK "Artifacts" me download hoga.
name: Build APK from uploaded zip

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        options: [release, debug]
        default: release
  push:
    paths:
      - "**.zip"
      - "**.ZIP"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the newest zip
        id: zip
        run: |
          set -euo pipefail
          BEST=""; BEST_T=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            [ -z "$t" ] && t=0
            if [ -z "$BEST" ] || [ "$t" -ge "$BEST_T" ]; then BEST="$f"; BEST_T="$t"; fi
          done < <(find . -type f \( -iname '*.zip' \) -not -path './.git/*' -not -path './.github/*' | sed 's|^\./||' | sort)
          if [ -z "$BEST" ]; then
            echo "::error::Repo me koi .zip nahi mila. Project zip ko upload/ folder me commit karo (Add file > Upload files) aur dobara run karo."
            echo "Repo files:"; git ls-files | head -50
            exit 1
          fi
          echo "Using: $BEST"
          echo "path=$BEST" >> "$GITHUB_OUTPUT"

      - name: Unzip and locate the Gradle project
        run: |
          set -euo pipefail
          rm -rf src_unzipped && mkdir src_unzipped
          unzip -q "${{ steps.zip.outputs.path }}" -d src_unzipped
          SETTINGS=$(find src_unzipped \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2- || true)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Zip ke andar settings.gradle / settings.gradle.kts nahi mila."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          if [ -f "$PROJECT_DIR/gradlew" ]; then echo "HAS_WRAPPER=1" >> "$GITHUB_ENV"; else echo "HAS_WRAPPER=0" >> "$GITHUB_ENV"; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build tools and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-30" "platforms;android-34" "build-tools;34.0.0" "ndk;22.0.7026061" || true

      - name: Set up Gradle (only if project has no gradlew)
        if: env.HAS_WRAPPER == '0'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          VARIANT="${{ github.event.inputs.variant }}"
          [ -z "$VARIANT" ] && VARIANT=release
          if [ "$VARIANT" = "debug" ]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          if [ "$HAS_WRAPPER" = "1" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon "$TASK"
          else
            gradle --no-daemon "$TASK"
          fi

      - name: Collect and sign the APK
        run: |
          set -euo pipefail
          mkdir -p out raw
          find "$PROJECT_DIR" -path '*outputs/apk*' -name '*.apk' -exec cp {} raw/ \;
          ls -la raw
          test -n "$(ls -A raw)"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -keystore ci.jks -alias ci -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=CI Build" >/dev/null 2>&1
          for apk in raw/*.apk; do
            name=$(basename "$apk")
            if echo "$name" | grep -qi unsigned; then
              out="out/${name/-unsigned/}"
              "$BT/zipalign" -f -p 4 "$apk" aligned.apk
              "$BT/apksigner" sign --ks ci.jks --ks-pass pass:android --key-pass pass:android \
                --out "$out" aligned.apk
            else
              cp "$apk" "out/$name"
            fi
          done
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error
          
